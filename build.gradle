buildscript {
    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
        gradlePluginPortal() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }

    dependencies {
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.13.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.57.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.16.0'
        classpath 'org.unbroken-dome.gradle-plugins:gradle-testsets-plugin:4.1.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.19.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.50.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:1.6.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:2.31.0'
        classpath 'com.palantir.gradle.shadow-jar:gradle-shadow-jar:3.0.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:6.3.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:3.1.0'
        classpath 'gradle.plugin.org.inferred:gradle-processors:3.7.0'
        classpath 'com.gradle.publish:plugin-publish-plugin:1.3.0'
    }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'
apply plugin: 'com.palantir.failure-reports'

javaVersions {
    libraryTarget = 11
    runtime = 21
}

version gitVersion()

allprojects {
    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
        gradlePluginPortal() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }

    group 'com.palantir.gradle.jdks'
    version System.env.CIRCLE_TAG ?: rootProject.version

    apply plugin: 'org.inferred.processors'
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'
}

// workaround for:
// `Error during resolution of the dependency graph of configuration configuration ':gradle-jdks-settings:unshadedCopy'`
checkUnusedConstraints.enabled = false

jdks {
    daemonTarget = 21
}


// Reproducing `docker` Cause: error=2, No such file or directory
// 1. make sure that Settings > Gradle > Gradle JVM = JDK21
// 2. run `./gradlew --stop` to stop all existing daemons
// 3. run through Intellij the tasks below

tasks.register("execTask", Exec) {
    setCommandLine("docker")
    environment("PATH", System.getenv())
}

// the logic from https://github.com/gradle/gradle/blob/253ca380343e89d6fba742f7f64fd81d0c513266/subprojects/core/src/main/java/org/gradle/process/internal/ProcessBuilderFactory.java#L36-L38
tasks.register("processBuilderTask") {
    doFirst {
        println(System.getenv())
        ProcessBuilder processBuilder = new ProcessBuilder();
        processBuilder.command("docker"); // located in: /usr/local/bin on mac
        processBuilder.inheritIO();
        // commenting the 2 lines below, makes the task successful
        // basically any change to the environment will lead to "docker" Cause: error=2, No such file or directory
        processBuilder.environment().clear();
        processBuilder.environment().put("PATH", "/usr/local/bin");
        processBuilder.start();
    }
}
