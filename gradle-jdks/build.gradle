    gradlePluginForTesting project(':gradle-jdks-settings')
    gradlePluginForTesting 'com.palantir.gradle.jdkslatest:gradle-jdks-latest'
    gradlePluginForTesting 'com.palantir.baseline:gradle-baseline-java'
    gradlePluginForTesting 'com.palantir.gradle.jdks:gradle-jdks-settings'
//    gradlePluginForTesting 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin'
//    gradlePluginForTesting 'com.palantir.gradle.shadow-jar:gradle-shadow-jar'
//    gradlePluginForTesting 'com.gradle.publish:plugin-publish-plugin'
//    gradlePluginForTesting 'com.palantir.gradle.consistentversions:gradle-consistent-versions'
}

gradlePlugin {
    plugins {
        jdks {
            id = 'com.palantir.jdks'
            displayName = 'Palantir JDK Auto-provisioning Plugin'
            description = 'Auto-provisions specific versions of JDKs'
            implementationClass = 'com.palantir.gradle.jdks.JdksPlugin'
            tags.addAll("java", "jdks")
        }
        palantirCa {
            id = 'com.palantir.jdks.palantir-ca'
            displayName = 'Palantir CA for gradle-jdks'
            description = 'Includes the Palantir CA from the system truststore'
            implementationClass = 'com.palantir.gradle.jdks.PalantirCaPlugin'
            tags.addAll("java", "jdks", "palantir ca")
        }
    }
    website = 'https://github.com/palantir/gradle-jdks'
    vcsUrl = 'https://github.com/palantir/gradle-jdks'
    description = 'Download specific JDKs versions automatically'
}

tasks.withType(JavaCompile).configureEach {
    it.options.errorprone.disable 'JavaxInjectOnAbstractMethod'
    it.options.errorprone.disable 'StrictUnusedVariable'
    it.options.errorprone.disable 'GradleTestPluginsBlock'
}


tasks.withType(Test) {
    environment(Map.of("PROJECT_VERSION", project.version))
    systemProperty 'ignoreDeprecations', 'true'
    dependsOn project(':gradle-jdks-settings').tasks.withType(PluginUnderTestMetadata.class)
}

tasks.withType(ProcessResources.class).configureEach {
    from(project(':gradle-jdks-setup').tasks.named('fatJar')) {
        rename { 'gradle-jdks-setup.jar' }
    }
}

gradleTestUtils {
    gradleVersions = ['8.14.3']
    configurationCacheEnabled = true
}


