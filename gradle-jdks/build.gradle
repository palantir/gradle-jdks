tasks.withType(PluginUnderTestMetadata).configureEach {
    def provider = project.provider(classpathForPlugin(project(':gradle-jdks-settings'), project(':gradle-jdks')))
    pluginClasspath.setFrom(provider)
}
//
//
private static Callable<FileCollection> classpathForPlugin(Project settingsProject, Project jdksProject) {
    return () -> {
        GradlePluginDevelopmentExtension extension = settingsProject.getExtensions().getByType(GradlePluginDevelopmentExtension.class);
        SourceSet settingsSourceSet = extension.getPluginSourceSet();
        Configuration settingsRuntimeClasspath = settingsProject.getConfigurations().getByName(settingsSourceSet.getRuntimeClasspathConfigurationName());
        ArtifactView settingsView = settingsRuntimeClasspath.getIncoming().artifactView(config ->
                config.componentFilter(JavaGradlePluginPlugin::excludeGradleApi)
        );

        GradlePluginDevelopmentExtension extension2 = jdksProject.getExtensions().getByType(GradlePluginDevelopmentExtension.class);
        SourceSet jdksSourceSet = extension2.getPluginSourceSet();
        Configuration jdksRuntimeClasspath = jdksProject.getConfigurations().getByName(jdksSourceSet.getRuntimeClasspathConfigurationName());
        ArtifactView jdksView = jdksRuntimeClasspath.getIncoming().artifactView(config ->
                config.componentFilter(JavaGradlePluginPlugin::excludeGradleApi)
        );

        // Get files from view first
        def settingsViewFiles = settingsView.getFiles()
        def viewFilePaths = settingsViewFiles.collect { it.absolutePath }.toSet()
        
        // Filter view2 to only include files not in view
        def jdksViewFilesWithNoDuplicates = jdksView.getFiles().findAll { file ->
            file.absolutePath.startsWith("/Volumes/git/gradle-jdks/") || file.absolutePath.contains("palantir")  || file.absolutePath.contains("palantir") || file.absolutePath.contains("guava") || file.absolutePath.contains("apache")
            //!viewFilePaths.contains(file.absolutePath)
        }
        
        return settingsProject.getObjects().fileCollection().from(
                settingsSourceSet.getOutput(),
                jdksSourceSet.getOutput(),
                settingsViewFiles,
                jdksViewFilesWithNoDuplicates,
        );
    };
}

